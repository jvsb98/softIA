name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  servidor-e-web:
    name: Tipos, testes, build e smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: softia
          POSTGRES_USER: softia
          POSTGRES_PASSWORD: ci-senha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U softia"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NIMBER_DB_HOST: localhost
      NIMBER_DB_PORT: "5432"
      NIMBER_DB_NAME: softia
      NIMBER_DB_USER: softia
      NIMBER_DB_PASSWORD: ci-senha
      NIMBER_CONFIG_DIR: ${{ runner.temp }}/softia-config
      BASE_DOMAIN: localhost
      PUBLIC_URL: http://painel.localhost:8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verificação de tipos (servidor e web)
        run: npm run typecheck
      - name: Testes unitários
        run: npm test
      - name: Build
        run: npm run build
      - name: Migrações num banco limpo
        run: node apps/server/dist/cli.js migrate
      - name: Migrações de novo (idempotência)
        run: node apps/server/dist/cli.js migrate
      - name: Smoke test e isolamento entre clientes
        working-directory: apps/server
        run: |
          PORT=8080 node dist/index.js > ../../server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/health && break; sleep 1; done
          curl -sf http://localhost:8080/api/health | grep -q softia
          # hostname desconhecido não tem cliente
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: nao-existe.localhost' http://localhost:8080/api/setup/status)" = "404"
          # dois clientes de teste: nenhum dado nem evento de um aparece no outro
          BASE_URL=http://127.0.0.1:8080 node scripts/test-isolation.mjs
          # a página do cliente abre
          node dist/cli.js tenant:list
          curl -sf -H 'Host: iso-a.localhost' http://localhost:8080/ | grep -qi "<!doctype html"
          kill %1 || true
      - name: Log do servidor (se falhar)
        if: failure()
        run: cat server.log || true

