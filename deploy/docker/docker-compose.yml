# =====================================================================
#  softIA — Docker Compose
#
#  Droplet COMPARTILHADO com a Central WhatsApp (o Caddy da Central atende 80/443):
#     cp .env.example .env   (preencha)
#     docker compose -f docker-compose.yml -f docker-compose.compartilhado.yml pull
#     docker compose -f docker-compose.yml -f docker-compose.compartilhado.yml up -d
#
#  Droplet DEDICADO (Caddy próprio; com Postgres no próprio servidor, some --profile local-db):
#     docker compose --profile caddy up -d
#
#  Guia completo: docs/DEPLOY.md
# =====================================================================
name: softia

services:
  softia:
    image: ${SOFTIA_IMAGE:-ghcr.io/jvsb98/softia:main}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    environment:
      # Banco (Supabase: use o pooler em MODO SESSÃO, porta 5432 — nunca o modo transação, 6543)
      NIMBER_DB_HOST: ${NIMBER_DB_HOST:-db}
      NIMBER_DB_PORT: ${NIMBER_DB_PORT:-5432}
      NIMBER_DB_NAME: ${NIMBER_DB_NAME:-postgres}
      NIMBER_DB_USER: ${NIMBER_DB_USER:-postgres}
      NIMBER_DB_PASSWORD: ${NIMBER_DB_PASSWORD:?defina NIMBER_DB_PASSWORD no .env}
      NIMBER_DB_SSL: ${NIMBER_DB_SSL:-false}
      NIMBER_DB_SSL_CA: ${NIMBER_DB_SSL_CA:-}
      NIMBER_DB_POOL_MAX: ${NIMBER_DB_POOL_MAX:-10}
      NIMBER_MASTER_KEY: ${NIMBER_MASTER_KEY:-}
      # Endereços: clientes em <slug>.BASE_DOMAIN, painel do fornecedor em PLATFORM_HOST
      BASE_DOMAIN: ${BASE_DOMAIN:?defina BASE_DOMAIN no .env, por exemplo connectawork.app.br}
      PLATFORM_HOST: ${PLATFORM_HOST:-}
      PUBLIC_URL: ${PUBLIC_URL:?defina PUBLIC_URL no .env, por exemplo https://painel.connectawork.app.br}
      # Nome do produto no painel do fornecedor (os clientes veem a marca de cada um)
      PLATFORM_BRAND_NAME: ${PLATFORM_BRAND_NAME:-softIA}
      TRUST_PROXY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      # Limite de memória do Node abaixo do limite do contêiner (o contêiner nunca derruba o servidor)
      NODE_OPTIONS: --max-old-space-size=${SOFTIA_HEAP_MB:-512}
      TZ: America/Sao_Paulo
    # Protege o que mais roda no Droplet (ex.: Central): se o softIA passar disso, só ele reinicia
    mem_limit: ${SOFTIA_MEM_LIMIT:-900m}
    volumes:
      - softia_config:/config
      - softia_data:/data
      # Banco com certificado próprio: coloque o arquivo nesta pasta e use NIMBER_DB_SSL_CA=ca.crt
      # - ./ca.crt:/config/ca.crt:ro
    ports:
      # Só para acesso local/SSH (curl http://127.0.0.1:8080/api/health); o público entra pelo Caddy
      - "127.0.0.1:${SOFTIA_LOCAL_PORT:-8080}:8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    image: pgvector/pgvector:pg16
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NIMBER_DB_NAME:-postgres}
      POSTGRES_USER: ${NIMBER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${NIMBER_DB_PASSWORD:?defina NIMBER_DB_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/softia.global:/etc/caddy/softia.global:ro
      - ../caddy/softia.site:/etc/caddy/softia.site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - softia

volumes:
  softia_config:
  softia_data:
  pgdata:
  caddy_data:
  caddy_config:
