<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'" />
    <title>Nimber Atende — servidor indisponível</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <aside class="field">
      <canvas aria-hidden="true"></canvas>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="#FE5A51"><rect x="7" y="7" width="6" height="6"/><rect x="19" y="7" width="6" height="6"/><rect x="13" y="13" width="6" height="6"/><rect x="7" y="19" width="6" height="6"/><rect x="19" y="19" width="6" height="6"/></g></svg>
        Nimber Atende
      </div>
      <p>As mensagens do WhatsApp continuam sendo recebidas pelo servidor. Nada se perde enquanto este computador está sem conexão.</p>
    </aside>
    <main>
      <div class="box">
        <h1>Não consegui abrir o painel</h1>
        <p class="lead" id="lead">O servidor não respondeu. Vou tentar de novo sozinho a cada 15 segundos.</p>
        <div class="row">
          <button class="primary" id="retry">Tentar agora</button>
          <button id="change">Trocar servidor</button>
        </div>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
      </div>
    </main>
    <script src="field.js"></script>
    <script src="offline.js"></script>
  </body>
</html>
